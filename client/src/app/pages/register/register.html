<section class="register">
  <div class="container register__container">
    <h2>Sign up</h2>

    <form (ngSubmit)="registerUser()">
      @if (error) {
        <p class="form__error-message">
          {{ error }}
        </p>
      }

      <input
        type="text"
        name="fullName"
        placeholder="Full name"
        [(ngModel)]="userData.fullName"
        [attr.maxlength]="validationLimits.fullName"
        autocomplete="name"
        required
        />

      <input
        type="email"
        name="email"
        placeholder="Email"
        [(ngModel)]="userData.email"
        [attr.maxlength]="validationLimits.email"
        autocomplete="email"
        required
        />

      <div class="password">
        <input
          [type]="showPassword ? 'text' : 'password'"
          name="password"
          placeholder="Password"
          [(ngModel)]="userData.password"
          [attr.minlength]="validationLimits.registrationPassword"
          [attr.maxlength]="validationLimits.passwordBytes"
          autocomplete="new-password"
          aria-describedby="password-requirements"
          required
          />

        <button
          type="button"
          class="password__toggle"
          (click)="togglePassword()"
          aria-label="Toggle password visibility"
          >
          <mat-icon>
            {{ showPassword ? 'visibility_off' : 'visibility' }}
          </mat-icon>
        </button>
      </div>

      <p id="password-requirements" class="form__hint">Use at least 15 characters.</p>

      <div class="password">
        <input
          [type]="showPassword ? 'text' : 'password'"
          name="confirmPassword"
          placeholder="Confirm password"
          [(ngModel)]="userData.confirmPassword"
          [attr.minlength]="validationLimits.registrationPassword"
          [attr.maxlength]="validationLimits.passwordBytes"
          autocomplete="new-password"
          required
          />

        <button
          type="button"
          class="password__toggle"
          (click)="togglePassword()"
          aria-label="Toggle password visibility"
          >
          <mat-icon>
            {{ showPassword ? 'visibility_off' : 'visibility' }}
          </mat-icon>
        </button>
      </div>

      <p>
        Already have an account?
        <a routerLink="/login">Sign in</a>
      </p>

      <button type="submit" class="btn primary" [disabled]="loading">
        {{ loading ? 'Registering…' : 'Register' }}
      </button>
    </form>
  </div>
</section>

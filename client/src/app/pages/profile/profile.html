<section class="profilePage">
  @if (user(); as u) {
    <app-user-profile
      [user]="u"
      (editProfile)="openEditProfile()"
      (followToggle)="toggleFollow()"
      (avatarChange)="changeAvatar($event)"
    ></app-user-profile>
    <h3 class="profilePage__title">{{ u.fullName }}’s posts</h3>
  }

  @if (loading()) {
    <app-feed-skeleton [count]="3"></app-feed-skeleton>
  }

  @if (!loading()) {
    @if (posts().length < 1) {
      <p class="center">No posts by this user</p>
    }
    @if (posts().length > 0) {
      <app-feeds
        [posts]="posts()"
        (postUpdated)="onPostUpdated($event)"
        (postDeleted)="onPostDeleted($event)"
      ></app-feeds>
    }
  }

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
</section>

<section class="bookmarks">
  <h2 class="bookmarks__title">Bookmarks</h2>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  @if (loading()) {
    <app-feed-skeleton [count]="3"></app-feed-skeleton>
  }

  @if (!loading()) {
    @if (isEmpty()) {
      <p class="center">No posts bookmarked</p>
    }
    @if (hasBookmarks()) {
      <app-feeds
        [posts]="bookmarks()"
        [bookmarkedIds]="bookmarkedIds()"
        (bookmarkChanged)="onBookmarkChanged($event)"
      ></app-feeds>
    }
  }
</section>

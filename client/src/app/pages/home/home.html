<section class="forest">
  <app-create-post
    [error]="error()"
    [loading]="posting()"
    (createPost)="createPost($event)"
  ></app-create-post>

  <app-for-you-or-following
    [active]="mode()"
    (modeChange)="onModeChange($event)"
  ></app-for-you-or-following>

  @if (loading()) {
    <app-feed-skeleton [count]="3"></app-feed-skeleton>
  }

  @if (!loading()) {
    @if (posts().length < 1) {
      <p class="center">No posts found</p>
    }
    @if (posts().length > 0) {
      <app-feeds
        [posts]="posts()"
        [bookmarkedIds]="bookmarkedIds()"
        (postUpdated)="onPostUpdated($event)"
        (postDeleted)="onPostDeleted($event)"
      ></app-feeds>
    }
  }
</section>

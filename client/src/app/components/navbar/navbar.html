<nav class="navbar">
  @if (open()) {
    <button
      type="button"
      class="navbar__backdrop"
      aria-label="Close search results"
      (click)="close()"
    ></button>
  }

  <div class="container navbar__container">
    <a routerLink="/home" class="navbar__logo">CHIRP</a>

    <div class="navbar__searchWrap">
      <form class="navbar__search" (submit)="$event.preventDefault()">
        <input
          type="search"
          [formControl]="search"
          placeholder="Search"
          (focus)="open.set(true)"
          autocomplete="off"
          />
        <button type="button" aria-label="Search">
          <mat-icon>search</mat-icon>
        </button>
      </form>

      @if (open()) {
        <div class="navbar__searchResults">
          @if (searching()) {
            <div class="navbar__searchLoading">Searching…</div>
          }
          @for (u of results(); track u) {
            <button
              type="button"
              class="navbar__searchItem"
              (click)="goToUser(u._id)"
              >
              @if (u.profilePhoto) {
                <app-profile-image [src]="u.profilePhoto" size="sm" />
              }
              <span class="navbar__searchName">{{ u.fullName }}</span>
            </button>
          }
          @if (showEmptyState) {
            <div class="navbar__searchEmpty">No users found</div>
          }
        </div>
      }
    </div>

    <div class="navbar__right">
      @if (auth.getUserId(); as userId) {
        <a
          [routerLink]="['/users', userId]"
          class="navbar__profile"
          aria-label="Profile"
          >
          @if (user()?.profilePhoto) {
            <app-profile-image
              [src]="user()!.profilePhoto ?? ''"
              size="sm"
            ></app-profile-image>
          }
        </a>
      }

      @if (auth.isLoggedIn()) {
        <button type="button" class="linkish" (click)="logout()">
          Logout
        </button>
      }
    </div>
  </div>
</nav>

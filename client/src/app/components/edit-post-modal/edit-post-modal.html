<form class="editPost" (click)="close($event)" (keydown.escape)="close()" (submit)="submit()">
  <div class="editPost__container">
    <h3 class="editPost__title">Edit post</h3>

    <textarea
      name="body"
      [ngModel]="body()"
      (ngModelChange)="body.set($event)"
      placeholder="What's on your mind?"
    ></textarea>

    <div class="editPost__actions">
      <button type="button" class="btn" (click)="close($event)" [disabled]="loading()">
        Cancel
      </button>

      <button type="submit" class="btn primary" [disabled]="loading()">
        {{ loading() ? 'Updating…' : 'Update Post' }}
      </button>
    </div>
  </div>
</form>
